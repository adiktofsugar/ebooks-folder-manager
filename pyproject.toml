[project]
name = "efm"
version = "0.1.0"
description = ""
authors = [
    { name = "Sean McCollum", email = "anincrediblyshortname@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",  # needed by lxml.html.soupparser (kfxlib)
    "cryptography>=50.0.2",
    "ebooklib>=0.20",
    "legacy-cgi>=2.6.4",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pycryptodomex>=3.24.1",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "xxhash>=4.0.2",
]

[project.scripts]
efm = "efm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["efm/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "debugpy>=1.8.22",
    "mock>=5.2.0",
    "pymupdf-stubs>=1.28.2",
    "pytest>=9.1.1",
    "pytest-rich>=0.3.0",
    "pytest-snapshot>=0.9.0",
    "ruff>=0.17.1",
    "ty>=0.0.100",
    "watchdog>=6.0.0",
]
