[project]
name = "efm"
version = "0.1.0"
description = ""
authors = [
    { name = "Sean McCollum", email = "anincrediblyshortname@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44.0.2",
    "ebooklib>=0.19",
    "legacy-cgi>=2.6.2",
    "lxml>=5.3.1",
    "pillow>=11.1.0",
    "pycryptodomex>=3.21.0",
    "pydantic>=2.11.7",
    "pymupdf>=1.25.3",
    "pypdf>=5.4.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "rich>=14.0.0",
]

[project.scripts]
efm = "efm.__main__:main"
efm-setup = "efm.setup.__main__:main"
# NOTE: can only be used directly in wine, windows, or macos
# finds and saves default adobe encryption keys. save to given output directory (optional)
# [<outputdir>]
getadobekey = "efm.DeDRM_plugin.adobekey:cli_main"
# given this is an epub, test what type of drm this is (adobe, etc)
# <key>
epubtest = "efm.DeDRM_plugin.epubtest:main"
# given this is an epub, and the key, decrypt it
# <key> <infile> <outfile>
epubdecrypt = "efm.DeDRM_plugin.ineptepub:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["efm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "debugpy>=1.8.14",
    "mock>=5.2.0",
    "pymupdf-stubs>=1.26.1.post1",
    "pytest>=8.4.0",
    "pytest-rich>=0.2.0",
    "pytest-snapshot>=0.9.0",
    "ruff>=0.11.13",
    "watchdog>=6.0.0",
]
